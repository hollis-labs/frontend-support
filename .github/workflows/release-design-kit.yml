# Manual npm release for the ts/design-kit packages. Never runs on push or tag.
# Publishing runs in the `npm-release` environment (no human reviewer; the gate job decides), and reads NPM_TOKEN
# from a secret reference only. Packages publish in dependency order; a version
# that is already on npm is skipped. `only` narrows a run to the named packages.
name: release-design-kit

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run instead of publishing"
        type: boolean
        default: true
      only:
        description: "Publish only these packages (directory names, space separated). Empty publishes every package whose version is not on npm."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-design-kit
  cancel-in-progress: false

jobs:
  # Who may publish. npm-release has no human reviewer: this job is the gate. RELEASE_ACTORS is a
  # repository variable (space-separated logins, e.g. "chrispian hollis-release-manager[bot]");
  # unset means nobody. Both the actor and whoever re-ran the job must be on it.
  gate:
    name: release gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: dispatcher is allowed to release
        env:
          ALLOWED: ${{ vars.RELEASE_ACTORS }}
          ACTOR: ${{ github.actor }}
          TRIGGERING: ${{ github.triggering_actor }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$REF" = "refs/heads/main" ] || { echo "release workflows run from main, not $REF"; exit 1; }
          for who in "$ACTOR" "$TRIGGERING"; do
            case " $ALLOWED " in *" $who "*) ;; *) echo "$who may not release (RELEASE_ACTORS)"; exit 1 ;; esac
          done
          echo "released by $ACTOR"

  publish:
    name: publish design-kit packages
    needs: gate
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      PACKAGES: >-
        design-tokens design-bindings
        eslint-config-design design-components design-app-runtime
        kit-cards kit-account kit-code kit-voice kit-workflow
        kit-chat kit-identity
        kit-dashboard kit-observe kit-settings kit-admin plugin-host-ui
        app-shell genui
    defaults:
      run:
        working-directory: ts/design-kit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: install
        run: npm ci

      # Workspace order is alphabetical, so a root `npm run build` builds
      # design-components before design-tokens and fails. Build in dependency order.
      - name: build in dependency order
        run: |
          set -euo pipefail
          for p in $PACKAGES; do
            npm run build -w "@hollis-labs/$p" --if-present
          done

      - name: publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          for o in $ONLY; do
            case " $(echo $PACKAGES) " in
              *" $o "*) ;;
              *) echo "unknown package in 'only': $o" >&2; exit 1 ;;
            esac
          done
          for p in $PACKAGES; do
            if [ -n "$ONLY" ]; then
              case " $(echo $ONLY) " in
                *" $p "*) ;;
                *) echo "skip $p (not in 'only')"; continue ;;
              esac
            fi
            dir="packages/$p"
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already on npm)"
              continue
            fi
            echo "publish $name@$version"
            if [ "$DRY_RUN" = "true" ]; then
              (cd "$dir" && npm publish --provenance --access public --dry-run)
            else
              (cd "$dir" && npm publish --provenance --access public)
            fi
          done
